version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: smartwaste-postgres
    restart: always
    environment:
      POSTGRES_DB: smartwaste
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartwaste"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartwaste-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/smartwaste
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgrespassword
      JWT_SECRET: SecureProductionSecretKeyForSmartWaste2026LeafCityEnvironmentalPlatform
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - app_uploads:/app/uploads

volumes:
  postgres_data:
  app_uploads:
