# ==========================================
# Server Configuration
# ==========================================
server.port=${PORT:8080}

# Application Details
spring.application.name=smart-waste-backend

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# Safe schema strategy that adds/updates tables without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# File Upload Configuration
# ==========================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB

# Storage directory for persistent uploads
upload.dir=${UPLOAD_DIR:./uploads}

# ==========================================
# Security & JWT Configuration
# ==========================================
# Production JWT secret comes from JWT_SECRET environment variable
jwt.secret=${JWT_SECRET:SmartWasteManagementSuperSecretKey2026SecureJwtTokenGeneratorLeafGreenEnvironmentCleanCity12345}
jwt.expiration-ms=86400000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ==========================================
# H2 Console (available only for local dev fallback)
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
